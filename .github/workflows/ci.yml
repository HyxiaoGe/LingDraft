name: CI

# PR：只跑测试（GitHub 的机器）。合进 master：测试过了再部署到 dev（dev 上的 self-hosted runner）
# 只改了文档、截图、.gitignore 的不跑也不部署（改动里只要有一个别的文件就照常跑）。按文件名写，不用 **.md：以后测试、代码要读的 .md 不会被漏掉
on:
  pull_request:
    paths-ignore:
      - "**/README.md"
      - "CHANGELOG.md"
      - "CLAUDE.md"
      - "assets/**"
      - ".gitignore"
  push:
    branches: [master]
    paths-ignore:
      - "**/README.md"
      - "CHANGELOG.md"
      - "CLAUDE.md"
      - "assets/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # 对话存在 Postgres 里：整套测试在内存里跑一遍，再在这个库上跑一遍（每个测试前清空）。版本跟 dev 上的库一样，带 pgvector（知识库）
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - name: 后端测试
        working-directory: backend
        run: |
          uv sync --frozen
          uv run playwright install --with-deps chromium
          uv run pytest -q
          LINGDRAFT_TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres uv run pytest -q
          uvx ruff@0.15.10 check app tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 前端检查和构建
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 30  # 最多等正在跑的回答 10 分钟，加上建镜像、等健康
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: 建镜像
        run: |
          cd ~/project/LingDraft
          git pull --ff-only
          LINGDRAFT_VERSION=$(git rev-parse --short HEAD) docker compose build
      - name: 等正在跑的回答跑完
        # 重启容器会打断正在跑的回答（记成 lost，用户得重问）。建镜像时旧容器照常服务；
        # 这里每 15 秒看一次 /api/health 的 busy（排着队、在跑的回答有几个），是 0 就往下走，最多等 10 分钟，到了照常重启。
        # 旧版本没有 busy、容器没在跑、读不到，都当 0。
        run: |
          for i in $(seq 1 40); do
            n=$(docker exec lingdraft python -c "import json, urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)).get('busy', 0))" 2>/dev/null || echo 0)
            if [ "$n" = 0 ]; then
              echo "没有在跑的回答，可以重启"
              exit 0
            fi
            echo "还有 $n 个回答在跑，等 15 秒（第 $i 次）"
            sleep 15
          done
          echo "等了 10 分钟还有回答在跑，照常重启"
      - name: 部署
        run: |
          cd ~/project/LingDraft
          LINGDRAFT_VERSION=$(git rev-parse --short HEAD) docker compose up -d
          docker image prune -f
      - name: 等容器健康
        run: |
          for i in $(seq 1 40); do
            s=$(docker inspect -f '{{.State.Health.Status}}' lingdraft)
            echo "health: $s"
            if [ "$s" = healthy ]; then
              echo "version: $(docker exec lingdraft printenv LINGDRAFT_VERSION)"
              exit 0
            fi
            sleep 3
          done
          docker logs --tail 80 lingdraft
          exit 1
