name: CI

# PR：只跑测试（GitHub 的机器）。合进 master：测试过了再部署到 dev（dev 上的 self-hosted runner）
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # 对话存在 Postgres 里：整套测试在内存里跑一遍，再在这个库上跑一遍（每个测试前清空）。版本跟 dev 上的库一样
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - name: 后端测试
        working-directory: backend
        run: |
          uv sync --frozen
          uv run playwright install --with-deps chromium
          uv run pytest -q
          LINGDRAFT_TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres uv run pytest -q
          uvx ruff@0.15.10 check app tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 前端检查和构建
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 20
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: 部署
        run: |
          cd ~/project/LingDraft
          git pull --ff-only
          LINGDRAFT_VERSION=$(git rev-parse --short HEAD) docker compose up -d --build
          docker image prune -f
      - name: 等容器健康
        run: |
          for i in $(seq 1 40); do
            s=$(docker inspect -f '{{.State.Health.Status}}' lingdraft)
            echo "health: $s"
            if [ "$s" = healthy ]; then
              echo "version: $(docker exec lingdraft printenv LINGDRAFT_VERSION)"
              exit 0
            fi
            sleep 3
          done
          docker logs --tail 80 lingdraft
          exit 1
