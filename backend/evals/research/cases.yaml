# 对话回放评测用例：每个用例是一段对话，每一项是用户说的一句话。字段和检查方式见 app/evals/research.py，写用例的约定见 ../README.md。
# 2026-10-30 定的先只做 chat：用例都是日常会问的问题，只看回答好不好、来源对不对。

- id: ai-week
  source: 先只做 chat（2026-10-30）：要查最新消息的日常问题
  turns:
    - say: 最近一周AI圈发生了什么
      expect: {searched: true}
      judge: 正文列出了几件具体的事，每件写了大致的日期；都是最近一周左右的事，没有把明显更早的旧闻说成这周的；不是只空泛地概括趋势。

- id: weather
  source: 先只做 chat（2026-10-30）：要查实时信息的日常问题。11-05 Sean 定 searched 改成 looked_up：有了天气工具，用天气工具查也算
  turns:
    - say: 深圳这周会不会降温
      expect: {looked_up: true}
      judge: 正文直接回答了会不会降温，给了这几天的具体气温或变化并写明日期；预报和已经发生的分得清。

- id: fact
  source: 先只做 chat（2026-10-30）：简单事实题，应该简短直接地答
  turns:
    - say: 珠穆朗玛峰现在的官方高度是多少？
      expect: {checked_time: false}  # “现在”说的不是几点（2026-11-01 加，见 time-of-day）
      judge: 正文一开头就给出了一个具体的高度数字，并说明是哪次测量或谁公布的；回答简短，没有写成长篇。

- id: cost
  source: 先只做 chat（2026-10-30）：说法不一的问题，第二句接着上一轮追问。11-05 Sean 定去掉 min_reads：读不读交给模型（10-31 定的）
  turns:
    - say: DeepSeek V3训练成本多少
      expect: {searched: true}
      judge: 正文给出了具体数字，并说明这个数字算的是什么范围和出处；有不同说法时说明了各自算的是什么；没有把某一种算法的数字说成全部成本。
    - say: 为什么 SemiAnalysis 的估计比官方高这么多？
      judge: 正文直接回答了差距从哪来，依据写了出处；接着上一轮说，没有把训练成本从头再讲一遍。

- id: time-of-day
  source: 几点钟改成工具取（2026-11-01 Sean 定，原来接在最新一条用户消息后面，每轮断掉上一轮的前缀缓存）：跟几点有关的要去取时间；第二轮看结果里 calls 的缓存接没接上
  turns:
    - say: 现在去故宫还来得及进去吗？
      expect: {checked_time: true, searched: true}
      judge: 正文说了现在大约几点，并据此直接回答了还来不来得及；写了故宫停止入场或闭馆的时间和出处。
    - say: 那明天几点开门？
      judge: 正文直接回答了明天几点开门，或者明确说明天不开放；接着上一轮说，没有把今天能不能进再讲一遍。

# ---- 查没查：该查的没调工具就给实时数字（Fusion 11-04“下下周三北京天气”0 次工具、编了一张天气表）；不该查的别查 ----
# 只看轨迹（looked_up），回答好不好、没查的那几次有没有编，人看对话记录

- id: lookup-weather-far
  source: Fusion 11-04 下下周三北京天气：没调工具，编了预报窗口和 5 天的天气
  turns:
    - say: 下下周三北京天气怎么样
      expect: {looked_up: true}

- id: lookup-weather-month
  source: 同上：远到任何预报都覆盖不到的日子，Sean 11-04 定不该查，直接说查不到（11-04 跑 3 次有 1 次调了天气）
  turns:
    - say: 下个月 20 号上海会下雨吗
      expect: {looked_up: false}

- id: lookup-weather-now
  source: 同上：天气工具没有实况气温，模型容易拿预报或常识凑一个数
  turns:
    - say: 杭州现在多少度
      expect: {looked_up: true}

- id: lookup-gold
  source: 同上：每天变的价格
  turns:
    - say: 今天金价多少钱一克
      expect: {looked_up: true}

- id: lookup-fx
  source: 同上：实时汇率
  turns:
    - say: 现在美元兑人民币汇率多少
      expect: {looked_up: true}

- id: lookup-index
  source: 同上：昨天的收盘数
  turns:
    - say: 昨天上证指数收盘多少点
      expect: {looked_up: true}

- id: lookup-score
  source: 同上：昨晚的比赛结果
  turns:
    - say: 昨晚湖人赢了吗，比分多少
      expect: {looked_up: true}

- id: lookup-price
  source: 同上：会变的官方售价
  turns:
    - say: iPhone 17 Pro 现在官网卖多少钱
      expect: {looked_up: true}

- id: lookup-restriction
  source: 同上：按日期变的规定
  turns:
    - say: 北京明天限行尾号是多少
      expect: {looked_up: true}

- id: lookup-followup
  source: 同上：上一轮查过天气，追问别的日子时最容易接着上一轮的结果直接答
  turns:
    - say: 北京这几天天气怎么样
      expect: {looked_up: true}
    - say: 那下下周三呢

# ---- 问用户：要写报告、没说做什么用，动手之前先问一次（work 模式第 2 步，2026-11-10 Sean 定先做调研写报告）----
# 整段跑一遍很贵（Pro 加子 agent、几十次搜索读页），平时只跑决策点（decisions --decision 'ask-*'）；这两个是改了相关提示词以后的最后确认

- id: report-ask-answered
  source: 11-10 第 1 步的真实模型验证用了“开始前先问我”，Sean 指出那是引导：这里不提醒，模型自己该问；回答以后接着做完，不再追着问
  turns:
    - say: 帮我写一份 Milvus 和 Qdrant 的对比报告
      answers: ["技术选型：给一个千万级向量的检索服务挑一个，团队 5 个人、没有专职运维"]
      expect: {asked: true, looked_up: true}
      judge: 正文说明了写好了一份报告，并且是按技术选型来写的（提到了选型的结论、建议或适用情况）；没有把“这份报告做什么用”再当成问题问一遍。

- id: report-ask-skipped
  source: 同上，用户跳过不答：按自己的假设做完，并说明是按什么假设写的（Sean 11-10 定）
  turns:
    - say: 帮我写一份 Milvus 和 Qdrant 的对比报告
      expect: {asked: true, looked_up: true}
      judge: 正文说明了写好了一份报告，并且交代了这份报告是按什么用途或假设来写的。
