# 决策点回放：从用例录的那遍里挑一次调模型，只重跑这一下（工具不执行），看模型这一下做了什么。字段见 app/evals/decisions.py，用法见 ../README.md。
# 状态取自 research --record 存下的检查点（data/evals/tapes/<用例>.snapshots.json），重录以后决策点前面的对话会跟着变。
# 写 say 不写 case 的不用录：这句话开一段新对话，看模型拿到它的第一下。

# ---- 查不查：第一次调模型就定了 ----

- id: weather-month-call1
  case: lookup-weather-month
  source: 11-05 天气说明改成明显超出预报范围的不调（agent-tools #57）：下个月 20 号这种不该调，直接说还查不到
  expect: {looked_up: false, replied: true}

- id: weather-far-call1
  case: lookup-weather-far
  source: 同上的另一边：下下周三在 15 天里、离边上近，照样要调
  expect: {looked_up: true}

# ---- 写正文：材料固定以后，正文里带角标的说法有没有依据 ----
# 11-05 噪声 3 遍里 sources_supported 时过时不过（8 个用例）；这里材料每次一样，只剩模型写正文这一下的差别

- id: index-reply
  case: lookup-index
  call: last
  source: 11-05 噪声：sources_supported 1/2（“当日两市成交额约2.04万亿元”判没依据）

- id: restriction-reply
  case: lookup-restriction
  call: last
  source: 11-05 噪声：sources_supported 1/2（“明天北京限行尾号 4 和 9”判没依据）

- id: price-reply
  case: lookup-price
  call: last
  source: 11-05 噪声：sources_supported 1/2（“部分早期报道把 512GB 写成了 7999 元”判没依据）

# ---- 问不问：Work 模式下拿到第一句话的第一下，停下来问用户（ask_user）还是直接做 ----
# 2026-11-10 Sean 定：问不问不靠提示词里列举情形，看用户选没选 Work——选了 Work 又是计划、调研、写报告这类任务，就先问；
# Chat 不给问用户的工具（代码定的，没什么可评的），所以这一组都是 work: true。
# 之前（#130）不分模式，只在“写报告、没说做什么用”时问：真实模型评测全对，Sean 上线后试的三句只有“对比报告”那句出了卡，这三句都收在下面。
# 跑这一组：decisions --decision 'ask-*' --model <选项>，开着思考、关着思考（--no-thinking）各跑一遍：Sean 自己用的时候关着

# 该问：计划、调研、写报告这类任务，原话里没有只有用户知道的那些（做什么用、给谁看、偏好、条件）
- id: ask-yes-compare
  say: 帮我写一份向量数据库的对比报告
  work: true
  source: 11-10 真实模型（Flash，本机对话 b00ecb3f）：思考里掂量过问不问，以“有合理的默认”为由没问，直接派子任务
  expect: {asked: true}

- id: ask-yes-two-products
  say: 帮我写一份 Milvus 和 Qdrant 的对比报告
  work: true
  source: 11-10 第 1 步真实模型验证用的那句去掉“开始前先问我”：不提醒它，自己该问
  expect: {asked: true}

- id: ask-yes-platforms
  say: 调研一下国内主流的大模型 API 平台，出一份报告
  work: true
  source: 同一类换个题目：给谁看、拿来选平台还是了解行情，查的东西不一样
  expect: {asked: true}

- id: ask-yes-frameworks
  say: 帮我写一份 AI Agent 开发框架的调研报告
  work: true
  source: 同一类换个题目
  expect: {asked: true}

- id: ask-yes-competitors
  say: 帮我写一份竞品分析报告，对比 Notion、飞书文档和语雀
  work: true
  source: 竞品分析要知道站在哪个产品的角度、给谁看，只有用户知道
  expect: {asked: true}

- id: ask-yes-phones
  say: 帮我对比下2026年新出手机的对比报告
  work: true
  source: Sean 11-10 在 dev 上试的三句之一（对话 6d9850cb，Pro、关着思考）：#130 的提示词下这句问了
  expect: {asked: true}

- id: ask-yes-news
  say: 帮我调研下英伟达最近的新闻进展
  work: true
  source: Sean 11-10 在 dev 上试的三句之一（对话 7b70f43b，Pro、关着思考）：#130 的提示词下没问，搜了两次直接答了
  expect: {asked: true}

- id: ask-yes-trip
  say: 我打算这两天去惠州散散心，找工作压力太大了
  work: true
  source: Sean 11-10 在 dev 上试的三句之一（对话 9135323f，Auto 分到 Kimi K3、关着思考）：没问也没查，给了一份泛泛的清单。不是“帮我做计划”的说法
  expect: {asked: true}

- id: ask-yes-travel-plan
  say: 帮我做一份元旦去成都玩的旅行计划
  work: true
  source: 计划类：几个人、几天、预算、喜欢什么只有用户知道
  expect: {asked: true}

- id: ask-yes-study-plan
  say: 帮我制定一个三个月的雅思备考计划
  work: true
  source: 计划类换个领域：现在什么水平、目标几分、每天能花多少时间
  expect: {asked: true}

# 不该问：让它直接做的；不是任务的（问答、查询、小活）。Work 模式下这些也照常做
- id: ask-no-told-to-go
  say: 帮我写一份向量数据库的对比报告，不用问我，按你的判断直接写
  work: true
  source: 用户让它自己定的不问
  expect: {asked: false, replied: false}

- id: ask-no-question
  say: Milvus 和 Qdrant 有什么区别？
  work: true
  source: 是个问题，不是要一份报告：答偏了再问一句就行
  expect: {asked: false}

- id: ask-no-lookup
  say: Qdrant 最新版本是多少，有什么新功能？
  work: true
  source: 查得到的事自己查
  expect: {asked: false, looked_up: true}

- id: ask-no-short-writing
  say: 帮我写一段 100 字左右的 Qdrant 简介
  work: true
  source: 小活：写偏了重写很快
  expect: {asked: false}

# 不定对错，只记下来看：任务的用途、条件原话里已经说了。Work 模式下再问点别的（原话里没有、又会改变结果的）可以，直接动手也可以；
# 不行的是把原话里说过的拿回去再问一遍（Sean 定的：原话里有的不拿回去确认）。问了什么在结果文件的 tool_calls 里，人看
- id: ask-open-purpose-given
  say: 我们要给一个千万级向量的检索服务选向量数据库，团队 5 个人、没有专职运维，帮我写一份 Milvus 和 Qdrant 的选型对比报告
  work: true
  source: PR #130 时是“不该问”（第一版提示词在这句上问过头：Flash 10 次里 6 次，问自建还是托管、侧重哪块）
  expect: {replied: false}

- id: ask-open-audience-given
  say: 下周要给组里的后端同事做一次技术分享，帮我写一份向量数据库入门的介绍文档
  work: true
  source: 同上：做什么用、给谁看都说了
  expect: {replied: false}

- id: ask-open-purpose-support
  say: 我们公司准备换客服系统，现在 30 个坐席，帮我写一份智齿科技、网易七鱼和 Udesk 的选型对比报告
  work: true
  source: 同 ask-open-purpose-given，换个领域
  expect: {replied: false}

- id: ask-open-purpose-talk
  say: 下个月要在行业论坛上做 20 分钟的演讲，听众是车企的市场负责人，帮我写一份 2026 年中国新能源车出口情况的调研报告当素材
  work: true
  source: 同 ask-open-audience-given，换个领域
  expect: {replied: false}

- id: ask-open-recommend
  say: 周末想带爸妈出去玩，有什么推荐？
  work: true
  source: 要推荐的：系统提示词写了不追着要条件、先给能用的（agent.tool_selection）。Work 模式下算不算“计划”两说，和 ask-yes-trip 挨得近，先看模型怎么认

# 也不定对错（2026-11-11 Sean 定）：缺一个条件的时候，出问题卡还是在正文里反问都行，由模型定——区别只是卡能接着当前这一轮往下做。
# 11-10 评测时这两句标的是“不该出卡”（我自己定的标准），Flash 关着思考每次都出卡：问城市、问博客的技术栈
- id: ask-open-pick
  say: 我想给个人博客加个搜索，数据量很小，用 Qdrant 还是 pgvector？
  work: true
  source: 选择题，条件给了一些：直接答可以，问一句博客现在用什么也可以

- id: ask-open-weather-place
  say: 明天天气怎么样？
  work: true
  source: 查东西缺条件（没说哪儿）：出卡问、正文里问都行；不该的是没问就挑一个城市查
  expect: {looked_up: false}
