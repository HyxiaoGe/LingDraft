# brief: true：这一下派了子 agent 的，裁判看交代（标准在 app/evals/prompts.toml 的 [brief]）；先自己搜一下再派的、不派的都不算错，也不检查。
# 跑这一组：decisions --decision 'brief-*' --samples 5 --no-sources --model deepseek-v4-pro，开着思考、关着思考（--no-thinking）各一遍。
