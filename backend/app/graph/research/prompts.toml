run_image_limit_reached = """No image was generated: this turn has already generated the maximum of {{ max_per_turn }} images. Do not call generate_image again in this turn; tell the user plainly which requested images were not generated, and offer to continue in the next message. Do not describe the image as if it exists and do not output any image link."""
# 编号不是这段对话里画的、还在的图：不交给服务。和服务的 source_image_unavailable 一样说（Fusion 2595e6d8 回放验证过）
source_image_unavailable = """The image to edit could not be found among the editable images of this conversation: the id may be wrong. Do not call again with this id or a guessed one. The original cannot be changed, so a new image drawn from its description will not keep it exactly. To redraw it, call this tool again without source_image_id; once that new image is generated, tell the user plainly that the original could not be edited directly and that this is a new image redrawn from the description, so details may differ. Never say that the original was changed or that its other parts were kept. If you do not redraw it, tell the user that this image cannot be edited directly, and offer to redraw it from its description."""
