# 图片：看图（看不见图的模型才有）、画图和改图，还有用户发的图怎么告诉模型（[tools.generate_image] 的 attached_*）。
# description 是工具说明，lingdraft 是接在 agent-tools 给的说明后面的灵稿自己的话，和参数同名的键是参数说明，其余是工具结果里给模型看的话。

[tools.view_image]
# 看图工具（app.tools.vision）：看不见图的模型才有。由 [roles] 的 vision（Flash）看图、用文字回答
description = """Look at an image in this conversation and answer a question about it. You cannot see images yourself, so use this whenever you need to know what an image shows: what is in it, text, numbers, or code written in it, or the details of a chart, table, screenshot, or photo. Ask a specific question; for a general look, ask for a detailed description that transcribes any text. Call it again with another question if you need more detail."""
image_id = "Id of an image the user attached to a message in this conversation, or of an image generated earlier in this conversation."
question = "What you want to know about the image, written so that it can be answered from the image alone."
viewer = """Answer the question below using only what is visible in the image. Transcribe any text, numbers, or code exactly as written. Describe positions, layout, and details precisely. If something is unclear, cut off, or not in the image, say so instead of guessing. Answer in the language of the question.

Question: {{ question }}"""
# 工具结果：没看成时模型看的
not_found = """No image with id {{ id }} exists in this conversation. Use an id given for an image the user attached or one generated earlier; do not guess ids."""
unavailable = """The image {{ id }} is no longer available, so it cannot be viewed. If it matters, tell the user plainly; do not guess what it showed."""
failed = """The image could not be viewed this time because the viewing service had a problem. You may try once more; if it fails again, tell the user plainly that you could not view the image, and do not guess what it shows."""

[tools.generate_image]
# 说明、参数，画成、没画成时给模型的话都在 image-service 里（Fusion 和灵稿共用，见 agent-tools 的 services/image/src/mcp/owned.py）。
# 这里是灵稿接在工具说明后面的一段、画成时接在结果后面的一句，和灵稿自己回的几种失败（见 app.tools.image_mcp）
lingdraft = """In LingDraft each generated image is shown to the user as an image card in your reply, labeled with the image model that drew it. The user can also attach images to a message; that message then says so and gives each image's id, which you can pass as source_image_id just like the id of a generated image."""
# 用户发的图：接在那句话后面给模型（存着的消息里没有，见 app.tools.vision）。看得见图的模型图就在前面；看不见的调 view_image（2026-11-08 Sean 定）；
# gone：图给不了模型了（太早的、服务里没了），编号还能拿去改图
_edit = """If the user wants an image changed, or a new image made from one (another style, a variation, something added or removed), call generate_image with source_image_id set to its id and write the prompt as an edit instruction: what to change, and what to keep. Do not show image ids to the user."""
attached_seen = """[The user attached {{ ids|length }} image{{ "s" if ids|length > 1 }} to this message, shown above in the order sent. Image id{{ "s" if ids|length > 1 }} in the same order: {{ ids|join(", ") }}. {{ edit }}]"""
attached_unseen = """[The user attached {{ ids|length }} image{{ "s" if ids|length > 1 }} to this message: {{ ids|join(", ") }}. You cannot see images directly. To find out what an image shows, call view_image with its id and a specific question, and call it again if you need more detail; never guess an image's contents. {{ edit }}]"""
attached_gone = """[The user attached {{ ids|length }} image{{ "s" if ids|length > 1 }} to this message ({{ ids|join(", ") }}), but {{ "they" if ids|length > 1 else "it" }} can no longer be shown to you, so do not guess what {{ "they" if ids|length > 1 else "it" }} showed. {{ edit }}]"""
shown = """The image card is shown to the user in this reply and already labels which image model drew it, so do not mention the model."""
# 还没连上时的占位工具
brief = """Generate a new image from a text description, or edit an image generated earlier in this conversation. Call it only when the user asks you to create, draw, or design an image, or to change an image generated earlier in this conversation."""
unavailable = """No image was generated: the image service could not be reached. Tell the user plainly that the image could not be generated this time and that they can try again. Do not describe the image as if it exists and do not output any image link."""
quota_exhausted = """No image was generated: the image service has used up its quota for today, so further calls will fail the same way. Do not call again today; tell the user plainly that images cannot be generated right now and that they can try again tomorrow. Do not describe the image as if it exists and do not output any image link."""
run_image_limit_reached = """No image was generated: this turn has already generated the maximum of {{ max_per_turn }} images. Do not call generate_image again in this turn; tell the user plainly which requested images were not generated, and offer to continue in the next message. Do not describe the image as if it exists and do not output any image link."""
# 编号不是这段对话里画的、还在的图：不交给服务。和服务的 source_image_unavailable 一样说（Fusion 2595e6d8 回放验证过）
source_image_unavailable = """The image to edit could not be found among the editable images of this conversation: the id may be wrong. Do not call again with this id or a guessed one. The original cannot be changed, so a new image drawn from its description will not keep it exactly. To redraw it, call this tool again without source_image_id; once that new image is generated, tell the user plainly that the original could not be edited directly and that this is a new image redrawn from the description, so details may differ. Never say that the original was changed or that its other parts were kept. If you do not redraw it, tell the user that this image cannot be edited directly, and offer to redraw it from its description."""
invalid_response = """Image generation failed: the image service returned an unexpected result. Tell the user plainly that the image could not be generated this time. Do not describe the image as if it exists and do not output any image link."""
