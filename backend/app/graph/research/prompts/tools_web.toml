# 查东西的工具：搜索、读页、查文档（Context7）、取当前时间。
# description 是工具说明，lingdraft 是接在 agent-tools 给的说明后面的灵稿自己的话，和参数同名的键是参数说明，其余是工具结果里给模型看的话。

# 搜索、读页的说明在 agent-tools 的 search-service、reader-service 里（Fusion 和灵稿共用：结果的样子、怎么准确使用结果、
# 失败了怎么办、参数），连上时取来；lingdraft 是接在后面的灵稿自己的话（见 app.tools.web_mcp）。搜索的：怎么搜、搜够没有、
# 来源 id；读页的：什么时候读、读哪些、来源 id。brief 是没连上时占位工具的说明；unavailable、quota_exhausted 是服务没给结果
# （连不上、网关今天的上限到了）时给模型的话。
# 什么时候搜、什么时候直接答不写在搜索的说明里：只写在系统提示词的 [Choosing tools]（agent.toml 的 tool_selection，2026-11-11 合并；
# 原来这里有照 Fusion ai_tools.web_search_* 写的 “Use this tool when / Do not use this tool for”，和系统提示词重复）。
# 子 agent 的系统提示词没有 [Choosing tools]：它是被派去查的，不用判断要不要查
[tools.search_web]
lingdraft = """Search strategy:
- You choose the query angles, batches, result count, and languages. A simple factual question usually needs one or two queries; a broader one, such as a news roundup, a comparison, or analysis of a current event, needs a few complementary queries. Issue independent queries in parallel as multiple search_web calls in the same response.
- Search in the language of the likely original sources; a translated query helps when it reaches different reporting. Answer in the user's language.
- Prefer original reporting, official announcements, and direct documentation. Spend a later batch only on a gap that matters to the answer, with a new angle rather than a paraphrase of an earlier query.

Deciding you have enough:
- Aim for the answer the user needs at the precision the question asks for, not for verifying every detail. Once the results support the main answer, write it.
- Report uncertainty instead of searching it away. When a detail is unclear, conflicting, or covered by a single source, say so in the answer, for example by marking an item as unconfirmed. Search again only when the gap would change the main answer.
- For lists and roundups, such as which cities a service covers, which products were released, or this week's news, answer from what the results cover and say the list may be incomplete; do not search item by item.
- Stop when new results repeat what you already have. If a specific fact is still missing after two or three rephrased attempts, it is probably not published where search can reach; say so and answer with what you found.
- Check carefully where the answer depends on it: exact numbers, dates, prices, rules, and conditions the user asked about. For those, prefer the primary source, use read_page when snippets are incomplete or disagree, and report conflicts between sources.

In LingDraft each result also has an id: the source id you cite in the answer."""
brief = "Search the web for current information and get candidate sources."
unavailable = "No search was run: the search service could not be reached. You may retry once; if it fails again, answer from what you already have and say that current information could not be looked up. Do not fabricate facts."
quota_exhausted = "No search was run: the search service has used up its quota for today, so further searches will fail the same way. Do not search again; answer from what you already have and say that current information could not be looked up. Do not fabricate facts."

# Fusion: prompt_templates/url-read-tool-description.j2、ai_tools.url（灵稿不预读用户消息里的网址，去掉了那一条）
[tools.read_page]
lingdraft = """Use this tool when:
- The user asks you to view, analyze, or summarize a webpage link.
- The conversation refers to a specific URL whose content must be retrieved.
- A search result needs deeper reading, especially to verify a key fact, official announcement, primary source, or source detail.
- After searching, prioritize official sources, primary announcements, and highly relevant results.

Source selection:
- Deprioritize videos, forums, and low-relevance results unless the request specifically requires them.
- Do not read every search result for form's sake. Read only the small number of high-value sources that materially improve accuracy.

Do not use this tool when:
- There is no specific URL to read.
- The task requires finding information rather than reading a particular page; use search_web instead.

In LingDraft a page that was read also has an id: the source id you cite in the answer. When content is truncated, the part cut off was not read; do not treat it as read."""
brief = "Read one web page and get its text."
unavailable = "Not read: the page-reading service could not be reached. You may retry once; if it fails again, use search results and pages already read, and say what could not be checked. The page cannot be used as evidence; do not fabricate its content."
quota_exhausted = "Not read: the page-reading service has used up its quota for today, so other pages will fail the same way. Do not keep trying other pages; continue with search results and pages already read, and say what could not be checked. The page cannot be used as evidence; do not fabricate its content."

# 查文档：Context7 的两个工具，说明、参数是 Context7 的（经 agent-tools 的 context7 服务），连上时取来；
# 这里是接在后面的灵稿自己的话（什么时候用、来源 id、查不到怎么办），和灵稿自己回的三种失败（见 app.tools.docs_mcp）。灵稿自己写的
[tools.resolve-library-id]
lingdraft = """In LingDraft, use resolve-library-id and then query-docs when the answer depends on how a specific programming library, framework, SDK, or developer API works now or in a named version: function and class signatures, configuration options, setup and migration steps, or code examples. They return excerpts of the library's own documentation, which are more complete and more current for this than web search snippets. Do not use them for general programming concepts, algorithms, code the user wrote themselves, or questions that are not about programming.
Choose the best-matching library yourself and continue to query-docs; ask the user only when the request could mean different libraries that would lead to different answers. Reuse a library ID already found earlier in this conversation instead of resolving it again."""

[tools.query-docs]
lingdraft = """In LingDraft each documentation excerpt has a "Source id" line under its Source URL: that is the source id you cite in the answer, as with search results; excerpts from the same page share one id. Base code in the answer on these excerpts and adapt it to the user's question; do not present code you wrote from memory as if it came from the documentation. If the excerpts do not cover what the user asked, query again with a narrower topic or use search_web and read_page, and say what remains unverified."""

# 找库、查文档没做成时给模型的话（灵稿自己回的，见 app.tools.docs_mcp）。Context7 回的错（找不到库、文档）是它的原话，不在这里
[tools.docs]
unavailable = "No documentation was looked up: the documentation service could not be reached. Use search_web and read_page to find the official documentation instead, or answer from what you know and say it is unverified. Do not fabricate APIs."
quota_exhausted = "No documentation was looked up: today's documentation lookups are used up, so further calls will fail the same way. Do not call resolve-library-id or query-docs again today; use search_web and read_page to find the official documentation instead, or answer from what you know and say it is unverified. Do not fabricate APIs."
rate_limited = "No documentation was looked up: the documentation service is rate-limited, possibly because its monthly quota is used up, so further calls will likely fail the same way. Do not call resolve-library-id or query-docs again in this turn; use search_web and read_page to find the official documentation instead, or answer from what you know and say it is unverified. Do not fabricate APIs."

# 灵稿自己的：Fusion 把几点钟接在最新一条用户消息后面，每轮都会断上一轮的前缀缓存，灵稿改成工具（2026-11-01 Sean 定）。
# “只在跟几点有关时用、不然别提”照 Fusion agent_loop.current_time 的说法
[tools.get_current_time]
description = """Get the current date, time, and weekday in Asia/Shanghai. The system prompt gives only today's date. Call this only when the request depends on the time of day, such as whether a place is open now, whether there is still time to do something today, or how long until an event; do not mention the time otherwise."""
