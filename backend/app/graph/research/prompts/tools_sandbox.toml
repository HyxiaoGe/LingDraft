Not shown to the user:
{% for s in skipped %}- {{ s.path }}: {% if s.reason == "too_many" %}only the first {{ max_outputs }} output files of one command are shown{% elif s.reason == "empty" %}the file is empty{% elif s.reason == "too_large" %}larger than {{ max_mb }} MB{% else %}it could not be saved; write it again to retry{% endif %}
