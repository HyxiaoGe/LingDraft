# 没跑成的（status=error）
empty = """The command was empty, so nothing was run."""
busy = """The sandbox is busy and could not run the command right now. Try the same command once more; if it is still busy, tell the user that it could not be run at the moment and do not make up its results."""
unavailable = """Running commands is not available right now, so the command was not run. Do not retry. Tell the user plainly that you could not run it, and do not present any result as if it had been computed."""
limit = """Today's limit for running commands has been reached, so the command was not run. Do not retry. Tell the user plainly, and do not present any result as if it had been computed."""
reset = """The command was not run: the sandbox workspace was full or damaged and has been reset. Files created by earlier commands in this conversation are gone; the user's attached files will be put back in uploads/ automatically. Run what you need again."""
