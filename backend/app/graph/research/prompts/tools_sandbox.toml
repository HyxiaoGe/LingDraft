# 沙箱：在隔离的环境里跑命令（app.tools.run_command，2026-11-11 Sean 定，方案见 docs/沙箱方案.md）。灵稿自己写的。
# description 是工具说明，和参数同名的键是参数说明，其余是工具结果里给模型看的话。

[tools.run_command]
# 只在工作任务里给，游客没有。环境、文件放哪、限制都写在工具说明里（没这个工具的对话系统提示词不用变）。
# 第一个场景是分析用户发的表格、出图表；装了什么包和 agent-tools 的 services/sandbox/runtime/requirements.in 对着写，那边改了这里跟着改。
# “不联网、装不了包”写明：不写的话模型会先 pip install，白跑一次。
# “每条命令是新的进程”写明：模型习惯了 notebook，会以为上一条命令里的变量还在。
# 产出在页面上的位置不让它说：2026-11-12 真实模型第一次跑，只写了“随回答一起显示”，回答里说“图已生成在右侧”，是它猜的；
# 改成写明“图在回答上面、文件卡片在回答下面”以后三次里还是说反一次（“上方卡片”）。页面怎么排以后也会变，所以只让它按文件名提。
# “空的、对不上的值”写明：同一次跑，表里 16 行销售额是空的，pandas 求和直接跳过，回答里没提这件事。
# 字体写出名字：只写“已经配好、别改”时，第二次真跑（关思考）它照习惯把 font.sans-serif 设成 Noto Sans CJK SC / SimHei 这些没装的，
# 第一批图全是方框，又多跑两条命令才改对。在沙箱里核过：默认是 WenQuanYi Micro Hei；seaborn 的 set_theme() 会把它换成 Arial，中文也成方框。
# 11-12 镜像里为出文档加了 Noto Sans / Serif CJK，matplotlib 也找得到（在新镜像里核过 findfont），所以不再说“只装了这一种”、不再把 Noto 列成没装的。
# 出文件（2026-11-12 Sean 定）：模型写的文件每份最新的一版在 uploads/documents/（见 app.tools.run_command 的 sync_documents），
# 转 PDF / Word 用沙箱里的 convert-doc（排版固定，见 agent-tools 的 services/sandbox/README.md“出文档”）。写明“来源 id 已经换成编号”：
# 它 cat 出来看到的和自己写的不一样。写明别自己写转换的代码：这一轮定的就是排版固定、模型不写排版代码（不写这句它会怎么做没试过）。
# PPT 转 PDF（2026-11-12 Sean 定先做）：镜像里装了 LibreOffice，convert-doc 多认 .pptx；这里只加了半句事实。之前没有这个能力时，
# 真实模型做完 PPT 就主动说过可以“转成 PDF 版本”。模型看不到自己排的页面，这个 Sean 定后面再解决，所以没让它转出来自己检查。
description = """Run a shell command in a private Linux sandbox that belongs to this conversation, and get back what it printed. Use it when the task needs real computation or file processing: analysing data files the user attached (spreadsheets, CSV), calculating statistics, drawing charts, or converting and generating files. Do not use it for what you can answer directly, and never present numbers as computed unless a command actually produced them.

The sandbox:
- The command runs with bash in /workspace. Python 3.12 is available with numpy, pandas, matplotlib, seaborn, scipy, openpyxl, xlrd, tabulate, python-docx, python-pptx, and pypdf. There is no network access and nothing can be installed, so work with what is there.
- Files the user attached in this conversation are in uploads/ under their original file names, read-only. The text of an attached file shown in the conversation may be shortened or cut off; the copy in uploads/ is the complete original, so compute from it.
- Files you wrote in this conversation with create_file or edit_file are in uploads/documents/, read-only and always the latest version, named after their titles: a document titled 上海三日游攻略 is uploads/documents/上海三日游攻略.md, and a web page ends in .html. In the copy of a document, the source ids are already replaced by numbered references with the list of sources at the end.
- To give the user a document as a PDF or Word file, run convert-doc, for example `convert-doc uploads/documents/上海三日游攻略.md outputs/上海三日游攻略.pdf` (end the output in .docx for Word). It lays out Markdown with a fixed style and handles headings, tables, code, formulas, images, and Chinese text; it also turns an .html file into a PDF, and a .pptx file into a PDF with one slide per page. Use it instead of writing conversion code yourself.
- Save what the user should receive (charts, result tables, converted files) in outputs/. Files created or changed there are shown to the user automatically next to your reply: images as pictures captioned with their file names, other files as cards they can open or download. Give them names the user will understand. Keep scripts, drafts, and intermediate files outside outputs/.
- Files in /workspace stay between commands in this conversation, but every command starts a new process: variables and imports are gone. For more than a one-liner, write a script to a file (for example with a heredoc) and run it; to fix a mistake, edit the script and run it again.
- A command is stopped after {{ default_timeout }} seconds unless you set timeout_seconds (at most {{ max_timeout }}). Output beyond {{ output_chars }} characters is cut in the middle, so print summaries, not whole tables.
- For charts, use matplotlib or seaborn and save with savefig. matplotlib is preconfigured with WenQuanYi Micro Hei, so Chinese text renders correctly as long as you leave the font settings alone. SimHei, Microsoft YaHei, PingFang SC, and other Windows or macOS fonts are not installed; naming them turns Chinese into empty boxes. seaborn's set_theme() and set_style() replace the font list, so after calling them set plt.rcParams["font.sans-serif"] back to ["WenQuanYi Micro Hei", "DejaVu Sans"]. Label charts in the language of the user's request.

Look at the data before analysing it (columns, types, a few rows, missing or inconsistent values), and check the output before relying on it. When something in the data affects the numbers, such as blank cells that were skipped, tell the user how you handled it. If a command fails, read the error, fix the cause, and run again. In your reply, say what you found and what each chart or file shows, referring to outputs by file name. Do not repeat file contents, do not say where on the page the outputs are, and do not write paths or links to them: the user already sees them."""
command = "The bash command to run. It may span several lines."
timeout_seconds = "Seconds to allow before the command is stopped, at most {{ max_timeout }}. Leave empty for the default."

# 工具结果：跑了的（命令自己失败、被杀掉的也是跑了）。输出原样给，产出登记了哪些、哪些没给用户、uploads/ 里和原名对不上的都说明
result = """{% if run.killed == "timeout" %}The command was stopped because it ran longer than {{ timeout }} seconds.{% if timeout < max_timeout %} If it really needs more time, set timeout_seconds (at most {{ max_timeout }}); otherwise make it do less work.{% else %} That is the longest a command may run; split the work into smaller steps.{% endif %}
{% elif run.killed == "memory" %}The command was killed because it used more memory than the sandbox has (1 GB). Process the data in smaller pieces.
{% elif run.killed == "disk_quota" %}The command was stopped because it filled the workspace. Delete files you no longer need before writing more.
{% elif run.killed %}The command was stopped before it finished.
{% endif %}Exit code: {{ run.exit_code if run.exit_code is not none else "unknown" }} ({{ seconds }} s)
