# 出行和本地的工具：天气、当前位置、查地点、比路线、航班、火车、行程卡。
# description 是工具说明，lingdraft 是接在 agent-tools 给的说明后面的灵稿自己的话，和参数同名的键是参数说明，其余是工具结果里给模型看的话。
# “When you use current_location … do not use current_location again in this turn.”这两句在天气、查地点、比路线的 lingdraft 里各有一份，改的时候三处一起改。

# 天气工具的说明在 agent-tools 的 weather-service 里（Fusion 和灵稿共用，照 Fusion 踩过的坑写的），连上时取来；
# 这里只有接在它后面的灵稿自己的话（天气卡片、当前位置从浏览器来、查不到时用哪个工具），和没调成时给模型的话（见 app.tools.weather_mcp）
[tools.get_weather]
lingdraft = """In LingDraft the forecast is shown to the user as a weather card that credits QWeather, with the daily forecast and, when hourly data is returned, a chart of temperature and precipitation probability, so do not recite it day by day. When you use current_location, LingDraft gets the device location from the user's browser, which the user may decline. If the location is not provided, do not use current_location again in this turn. When this tool fails or cannot cover what the user asked, use search_web and read_page to find authoritative sources."""
unavailable = "The weather service returned no usable result. Answer from available information and do not fabricate weather facts."

# 模型选了当前位置（current_location）而没拿到用户的位置时，天气、查地点、比路线回给模型的话（灵稿自己回的，工具没调，见 app.tools.location）。
# 照 Fusion 踩过的坑（backend/app/services/stream/tool_context.py）：说清工具没执行、别说拿到了位置、这一轮别再要。
# 记忆里有用户在哪的可以拿来用（2026-11-11 Sean 定：和记忆搭配），用了要说；said 是位置卡出着时用户直接说了个地方
[tools.location]
declined = "The tool was not run: the user chose not to share their device location. Do not use current_location again in this turn, and do not claim to know where the user is from their device. If what you remember about the user says where they are and that is precise enough for this request, use that place and tell the user which place you used; otherwise ask the user which place to use."
unavailable = "The tool was not run: the user's browser could not provide the device location. Do not use current_location again in this turn, and do not claim to know where the user is from their device. If what you remember about the user says where they are and that is precise enough for this request, use that place and tell the user which place you used; otherwise ask the user which place to use."
said = """The tool was not run: instead of sharing their device location, the user replied with the text below. Take the place from that reply and call the tool again with it; do not use current_location again in this turn. If the reply does not name a place, ask the user which place to use.
<user_reply>
{{ answer }}
</user_reply>"""
again = "The tool was not run: the device location was already requested in this turn and was not provided. Do not use current_location again in this turn; use a place the user named, or ask the user which place to use."

# 地图两个工具的说明、参数、结果、失败时给模型的话都在 agent-tools 的 maps-service 里（Fusion 和灵稿共用，照 Fusion 踩过的坑写的），连上时取来；
# 这里是接在它后面的灵稿自己的话（卡片、当前位置从浏览器来、查不到时用哪个工具），还没连上时占位工具的说明，和灵稿自己回的两种失败（见 app.tools.maps_mcp）。
# 当前位置 11-11 做了（见 app.tools.location）：之前这里写的是“灵稿拿不到用户的位置，不要用 current_location”
[tools.place_search]
lingdraft = """In LingDraft the places are shown to the user as a place card that credits the map provider, with each place's address, distance, rating, average cost per person, and opening hours when available, so do not list every field again; pick out and explain what matters for the user's request. When you use current_location, LingDraft gets the device location from the user's browser, which the user may decline. If the location is not provided, do not use current_location again in this turn. When this tool fails or cannot cover the request, use search_web and read_page to find authoritative sources."""
brief = "Search for places such as restaurants, shops, attractions, and facilities in mainland China, within a city or near a named place."
unavailable = "No place was found: the map service could not be reached. You may retry once; if it fails again, use search_web and read_page instead. Do not fabricate place facts."
quota_exhausted = "No place was found: the map service has used up its quota for today, so further map calls will fail the same way. Do not call place_search or route_compare again today; use search_web and read_page instead. Do not fabricate place facts."

[tools.route_compare]
lingdraft = """In LingDraft the routes are shown to the user as a route card that credits the map provider, with each mode's time, distance, and cost and the transit lines and stops, so do not recite them step by step; compare the modes and recommend one for the user's situation. When you use current_location, LingDraft gets the device location from the user's browser, which the user may decline. If the location is not provided, do not use current_location again in this turn. When this tool fails or cannot cover the request, use search_web and read_page to find authoritative sources."""
brief = "Compare transport modes (driving, transit, walking, bicycling) between two places in mainland China."
unavailable = "No route was computed: the map service could not be reached. You may retry once; if it fails again, use search_web and read_page instead. Do not fabricate route facts."
quota_exhausted = "No route was computed: the map service has used up its quota for today, so further map calls will fail the same way. Do not call place_search or route_compare again today; use search_web and read_page instead. Do not fabricate route facts."
# 灵稿自己核对的（见 app.tools.flyai_mcp.check_route_stations）：起终点是这段对话查到的车站、机场时，城市要填那个班次给的。
# 照 Fusion 9685489a（班次站点缺少城市时，要求模型用这一轮查到的城市修参）；灵稿认这段对话里查到的站
station_city = """No route was computed. {% for p in problems %}The {{ p.endpoint }} {{ p.station }} is a station returned by a flight or train search in this conversation, located in {{ p.city }}{% if p.given %}, but {{ p.endpoint }}_city was {{ p.given }}{% else %}, but {{ p.endpoint }}_city was not given{% endif %}. {% endfor %}Call route_compare again with each such station's returned city as its city field, keeping the station name exactly as returned."""

# 航班、火车两个工具的说明、参数、结果、失败时给模型的话都在 agent-tools 的 flyai 服务里（Fusion 和灵稿共用），连上时取来；
# 这里是接在后面的灵稿自己的话（卡片、接站换乘怎么查、要排行程时用哪个工具）和还没连上时占位工具的说明（见 app.tools.flyai_mcp）。
[tools.search_flights]
lingdraft = """In LingDraft every returned flight is shown to the user as a flight card that credits Fliggy, with its number, airline, airports and terminals, times, duration, class, reference price, and a booking link, so do not list the flights again or put them in a table, and do not output booking links; pick out two or three flights that fit the user's request and explain the differences. When the user wants a trip arranged from the results, such as an outbound and a return or a train and a flight, call present_itinerary after the searches. When the user also asks how to get between an airport and a place in the city, pick one returned flight, call route_compare with that flight's airport name exactly as returned and set that endpoint's city field to the city returned with it; do not guess an airport or query several candidates."""
brief = "Search one-way direct flights between two cities on one date, with reference fares at query time."

[tools.search_trains]
lingdraft = """In LingDraft every returned train is shown to the user as a train card that credits Fliggy, with its number, train type, stations, times, duration, seat class, reference price, and a booking link, so do not list the trains again or put them in a table, and do not output booking links; pick out two or three trains that fit the user's request and explain the differences. When the user wants a trip arranged from the results, such as an outbound and a return or a train and a flight, call present_itinerary after the searches. When the user also asks how to get between a station and a place in the city, pick one returned train, call route_compare with that train's station name exactly as returned and set that endpoint's city field to the city returned with it; do not guess a station or query several candidates."""
brief = "Search one-way direct trains, including high-speed rail, between two cities on one date, with reference fares at query time."

# 灵稿自己回的失败（服务没连上、网关今天的上限到了、这一轮查的次数到了），航班、火车共用，noun 是 flight 或 train
[tools.travel]
unavailable = "No {{ noun }}s were fetched: the travel service could not be reached. You may retry once; if it fails again, tell the user the {{ noun }} lookup could not be completed and suggest trying again later. Do not give {{ noun }} numbers, times, or prices from memory."
quota_exhausted = "No {{ noun }}s were fetched: the travel service has used up its quota for today, so further searches will fail the same way. Do not call search_flights or search_trains again today; tell the user that flight and train lookups are unavailable for today. Do not give flight or train numbers, times, or prices from memory."
turn_limit = "No {{ noun }}s were fetched: this turn has already run the maximum of {{ max_per_turn }} flight and train searches. Do not call search_flights or search_trains again in this turn; answer from the results you have, and tell the user which lookups were not run so they can ask for them in their next message."

# 灵稿自己的行程卡（Fusion 有同样的东西，见 fusion 的 runtime_prompts.toml [itinerary]，这里另写）：模型从查到的班次里挑，
# 按 option_id 列，灵稿核对编号、顺序后画成行程卡（见 app.tools.flyai_mcp.present）
[tools.present_itinerary]
description = """Show the user an itinerary card built from flights or trains you choose from earlier search_flights and search_trains results in this conversation. Call it only when the user wants a trip arranged, such as an outbound and a return, several cities in a row, or a train and a flight combined, and only after the searches have returned. Do not call it when the user only wants to look up or compare services: every returned service is already shown on a flight or train card.
- In each plan, list the option_id values exactly as returned, in travel order; each service must depart after the previous one arrives.
- Give each plan a short title and a one-sentence reason based on the returned fields and what the user asked for.
- Offer more than one plan, at most {{ max_plans }}, only for a real trade-off, such as price against travel time.
- Call it at most once per answer."""
title = "A short title for the whole trip, in the user's language, such as the route and dates."
plans = "The plans to show, the recommended one first."
plan_title = "A short title for this plan, in the user's language."
plan_reason = "One sentence in the user's language on why this plan fits the user's request, based only on returned fields."
option_ids = "The option_id of each service in this plan, exactly as returned, in travel order."
presented = """The itinerary card is shown to the user with {{ plan_count }} plan(s): {{ plan_titles }}. It already shows each service's number, stations, times, class, and reference price, so do not restate them; briefly explain the choice and any caveats, such as fares being reference prices at query time. Do not call present_itinerary again in this answer."""
failed = """The itinerary card was not shown. {{ detail }} Correct the plan using only option_id values returned by flight or train searches in this conversation, or answer without the card."""
already_presented = """An itinerary card has already been shown in this answer. Do not call present_itinerary again; describe any further changes in your reply."""
