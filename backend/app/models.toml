# ---- Auto 怎么选（2026-11-08 Sean 定）----
# 第一句话让 [roles] 的 route 判断难易，定下一个模型，整段对话沿用（后面问题再复杂也不换）：
# - 复杂的：登录用户用 Auto 选项的模型（上面的 V4 Pro），游客用备用（游客只能用免费模型和备用）。
# - 简单的：下面的免费额度按到期日从早到晚挑第一个能用的，都用不了用备用。
# 出问题换备用：首字 30 秒没来、上游出错、免费额度用完、到期。Auto 的对话换过去就一直用备用；用户自己选的模型只有这一轮用备用，下一轮照旧
# （见 graph.research.agent 的 ModelSelect）。DeepSeek 自己坏了备用也顶不上，先不管（Sean 定）。
[auto]
fallback = "deepseek-flash"  # 选项 id；固定用 DeepSeek Flash（Sean 定，起标题、推荐问题、写短版也是它）

# 免费额度：各家给的试用额度（百炼控制台“模型用量 → 免费额度”能看到剩多少、哪天到期）。用完了、到期了自动不用：
# - 不记还剩多少：厂商报额度用完（百炼是 AllocationQuota.FreeTierOnly）就当用完了，见 model_guard.FreeTierUsedUp。
# - 前提：控制台里这个模型的“免费额度用完即停”开着，不然用完会接着按量收钱，我们记成 0 元（没有这个开关的厂商不往这里放）。
# - until 照控制台的到期日写，这天北京时间 0 点起不再用；过了的删掉就行。
# - 子 agent 用备用的；思考开关跟用户（这几个都实测过能关，2026-11-08）；记账是 0 元（rate 记成 free_tier），用户的额度也不扣。
# - 不能同时是上面的选项或下面的内部用途（同一个模型记账会分不开）。
# 2026-11-08 百炼：qwen3.8-max-0902 只剩 3 万多、用完即停没开，不放。
[[free]]
model = "dashscope:kimi-k3"
name = "Kimi K3"
icon = "moonshot"
until = 2026-11-17

[[free]]
model = "dashscope:deepseek-v4.1-flash-1017"
name = "DeepSeek V4.1 Flash"
icon = "deepseek"
until = 2027-01-17

[[free]]
model = "dashscope:kimi-k3.1-pro"
name = "Kimi K3.1 Pro"
icon = "moonshot"
until = 2027-02-02

# ---- 内部用途：用户看不到，不跟着选项走 ----
[roles]
# 起标题照 Fusion 用轻量模型、不开思考：标题是锦上添花，慢了、坏了就用原话（见 graph.research.agent._TitleJob）
title = { model = "deepseek:deepseek-flash" }
# 推荐问题：不开思考，小活（2026-11-08 Sean 定从 Pro 换成 Flash，和起标题、写短版统一）
suggest = { model = "deepseek:deepseek-flash" }
# 内容审核拦下请求时把资料一条条单独送审。只认得 DeepSeek 的拦截（见 app.model_guard），别家的审核以后统一做（2026-11-05 Sean 定）
probe = { model = "deepseek:deepseek-v4-pro" }
# 对话太长时给之前几轮写短版（见 graph.research.compaction）
summarize = { model = "deepseek:deepseek-flash" }
# 每天整理一次记忆：开思考，要判断一件事是长期的还是一次性的（见 graph.research.memory）
dream = { model = "deepseek:deepseek-v4-pro", thinking = true, effort = "high" }
# 评测的裁判：换被测的模型时裁判不变，分数才比得了（见 app.evals.research）
judge = { model = "deepseek:deepseek-v4-pro" }
# Auto 第一句话判断难易（见上面的 [auto]）：不开思考，小活；坏了、慢了当复杂
route = { model = "deepseek:deepseek-flash" }

# ---- 价格：成本记账用（见 app/costs.py），每次调模型按调用开始那一刻的价算好记下 ----
# 2026-11-06 照各家官网填的（来源见 docs/credits/价格表-2026-11-06.md），国内站按量付费，元 / 百万 token。各家调价了改这里（Sean 和 Claude 手动维护），
# 改了只影响之后的调用，记下的不重算。用户能选的、内部用途用的模型都要有价格（没有的启动就报错）；只在藏起来、停了的选项里的可以没有，记成本时记成“不知道”。
# cached 是输入里命中缓存的，input 是没命中的（Kimi、MiniMax、千问建缓存都按输入价收，也算这里），output 是输出（含思考）。
# off_peak：闲时价，什么时候是高峰见下面的 [peak]（现在只有 DeepSeek 分峰谷）。
# promo：限时优惠，until 之前按它（写上时区）；过期了照常价算，记账时打一条警告，删掉就行。
# tiers：按这次调用的输入 token 数分档，超过 above_input 的按那一档（现在只有 MiniMax M3）。分档和峰谷、优惠没有一起出现过，写在一起直接报错，遇到了再定怎么叠。
# 不进表的：新用户的赠送额度（账号一次性的，对账时厂商账单会少一截）；智谱以后要收的缓存存储费（按小时收，分不到每次调用上，对账时看）。

[peak]
# DeepSeek 的高峰：北京时间周一到周五 9–12 点、14–18 点，法定节假日除外；其余时间（周末、节假日全天）按 off_peak。
# 官网没说按请求开始还是结束的时间算，这里按开始的
hours = [[9, 12], [14, 18]]
# 法定节假日放假的日子（国务院每年的放假安排，连休里调休凑出来的几天也算；调休上班的周六日不管，规则只认周一到周五）。
# 从 2026-11-06 开始记账，今年剩下的日子没有节假日；2027 年的安排一般年底公布，公布了加进来、把 holidays_through 往后挪，过了这天记账时打警告
holidays = []
holidays_through = 2026-12-31

# 工具每次调用算多少元，只算成功的（见 app.costs.charge_tool）。按上游的大致成本估的（2026-11-06）：
# 画图是豆包 Seedream 一张约 0.2 元；搜索、读页按 agent-tools 后面付费 provider（Brave、Firecrawl）的单价约 0.005；
# 地图、航班火车是高德、flyai 的免费额度，象征性收一点免得刷；天气、Context7 查文档也一样。没列的（task、recall、排行程）不收
[tools]
generate_image = 0.2
search_web = 0.005
read_page = 0.005
place_search = 0.002
route_compare = 0.002
search_flights = 0.002
search_trains = 0.002
get_weather = 0.001
resolve-library-id = 0.001
query-docs = 0.001

