# ---- Auto 怎么选（2026-11-08 Sean 定）----
# 第一句话让 [roles] 的 route 判断难易，定下一个模型，整段对话沿用（后面问题再复杂也不换）：
# - 复杂的：登录用户用 Auto 选项的模型（上面的 V4 Pro），游客用备用（游客只能用免费模型和备用）。
# - 简单的：下面的免费额度（没有 same_as 的）按到期日从早到晚挑第一个能用的，都用不了用备用（备用照样先走 Flash 的免费额度）。
# 出问题换备用：首字 30 秒没来、上游出错、免费额度用完、到期。Auto 的对话换过去就一直用备用；用户自己选的模型只有这一轮用备用，下一轮照旧
# （见 graph.research.agent 的 ModelSelect）。DeepSeek 自己坏了备用也顶不上，先不管（Sean 定）。
[auto]
fallback = "deepseek-flash"  # 选项 id；固定用 DeepSeek Flash（Sean 定，起标题、推荐问题、写短版也是它）

# 免费额度：各家给的试用额度（百炼控制台“模型用量 → 免费额度”、腾讯 TokenHub 控制台“在线推理服务”能看到剩多少、哪天到期）。用完了、到期了自动不用：
# - 不记还剩多少：厂商报额度用完就当用完了（百炼 403 insufficient_quota 或 AllocationQuota.FreeTierOnly，TokenHub 401007/401008），见 model_guard.FreeTierUsedUp。
# - 前提：用完了不接着收钱。百炼要开着这个模型的“免费额度用完即停”；TokenHub 要关着这个接入点的后付费（开了的用完接着按量收、不报错），
#   不然我们记成 0 元其实在花钱（没有这种开关的厂商不往这里放）。
# - until 照控制台的到期日写（北京时间；TokenHub 接口给的是 UTC，要换算），这天北京时间 0 点起不再用；过了的删掉就行。
# - 记账是 0 元（rate 记成 free_tier）；用户的额度照常扣（免费额度是我们省的，2026-11-09 Sean 定）：按 same_as 的价格，
#   没有 same_as 的按 Auto 备用的价格（没有免费额度时会用的那个，见 Catalog.billed_as）。不能同时是上面的选项或下面的内部用途（同一个模型记账会分不开）。
# - 没有 same_as 的给 Auto 判为简单的对话用，按 until 从早到晚：子 agent 用备用的，思考开关跟用户（都实测过能关，2026-11-08）。
# - same_as：托管在别家、和某个选项是同一个模型的（写那个选项的 model，name、icon 不写就用那个选项的）。用到那个模型的都先走免费额度：
#   选了那个选项、Auto 判为复杂的（主 agent）、子 agent、内部用途（[roles]，单条送审除外）、换备用时的 Flash；有几个的按 until 早的先用，
#   用完、到期、出错再走直连。页面上还是那个选项，不标免费（额度大家共用，随时会用完）；Auto 判为简单的不挑这些，
#   大模型的额度留给选了它的（2026-11-08 Sean 定）。思考开关、强度照选项的（内部用途照 [roles] 的）。
# 没有对应选项的只有 K3（已经旧了）。翻译、角色扮演、写代码、看图的专用模型和预览版、要下线的不放；
# TokenHub 的 deepseek-v4-flash-202605 是 V4 Flash 0731，比直连的旧，也不放。
# 2026-11-08 百炼：qwen3.8-max-0902 只剩 3 万多、用完即停没开，不放。
# 2026-11-09 百炼的 kimi-k3、deepseek-v4.1-flash-1017 报了免费额度用完，删了（Sean 定：百炼的试用额度用完了）；kimi-k3.1-pro 还没报，留着。

# -- Auto 判为简单的用 --
# 下面 TokenHub 的：2026-11-08 Sean 整理的接入点列表，每个 100 万 token；腾讯混元自己的（hy4、hy3）是选项，在同一个接入点上，开了后付费，不在这里
[[free]]
