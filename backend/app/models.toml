# ---- 内部用途：用户看不到，不跟着选项走 ----
[roles]
# 起标题照 Fusion 用轻量模型、不开思考：标题是锦上添花，慢了、坏了就用原话（见 graph.research.agent._TitleJob）
title = { model = "deepseek:deepseek-flash" }
# 推荐问题：不开思考，小活
suggest = { model = "deepseek:deepseek-v4-pro" }
# 内容审核拦下请求时把资料一条条单独送审。只认得 DeepSeek 的拦截（见 app.model_guard），别家的审核以后统一做（2026-11-05 Sean 定）
probe = { model = "deepseek:deepseek-v4-pro" }
# 对话太长时给之前几轮写短版（见 graph.research.compaction）
summarize = { model = "deepseek:deepseek-flash" }
# 每天整理一次记忆：开思考，要判断一件事是长期的还是一次性的（见 graph.research.memory）
dream = { model = "deepseek:deepseek-v4-pro", thinking = true, effort = "high" }
# 评测的裁判：换被测的模型时裁判不变，分数才比得了（见 app.evals.research）
judge = { model = "deepseek:deepseek-v4-pro" }
