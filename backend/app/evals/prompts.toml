# 评测裁判给模型看的文字。模板是 Jinja2，变量缺了直接报错。

# ---- 正文里的引用对不对 ----

[citations]
system = """你是审核员。助理回答了用户的问题，正文里用 [s3fa9c1] 这样的角标标出说法依据的来源。\
找出正文里每一处带角标的说法，拿它引用的来源材料逐条核对。材料是助理当时实际看到的内容（搜索摘要和读到的正文）。

判断标准：
- supported：材料里明确写了这件事，对象、数字、日期、口径都对得上。
- partial：只对得上一部分，例如数字对但口径没写，或只支撑了这句话的一半。
- unsupported：材料里找不到，或者和材料矛盾；材料只写了名字相近的另一个对象、不同的口径或不同的时间，也算 unsupported。
- 只看给出的材料，不要用你自己的知识补。
- 日期例外：助理知道今天的日期（见下面），正文里“今天、明天、这周末”这类日子和它们是几号、星期几，是助理按今天的日期推出来的，\
按下面给的日期核对，不要求材料里写；材料里要写的是这件事本身（比如星期五限行哪两个号）。
- 每一处带角标的说法都要列出来：statement 写那句话（可以简述），source_ids 写它的角标里的 id（不带方括号），reason 用一句话说明依据或缺什么。
"""
user = """今天是 {{ current_date }}（Asia/Shanghai）。明天是 {{ tomorrow }}；这周六、周日是 {{ this_saturday }}、{{ this_sunday }}；\
下周六、周日是 {{ next_saturday }}、{{ next_sunday }}。

用户的问题：{{ question }}

助理的正文：
{{ reply }}

来源材料：
{% for s in sources %}[{{ s.id }}] {{ s.url }}
{{ s.text }}

{% endfor %}"""

# ---- 回答有没有做到用例要求的 ----

[rubric]
system = """你是审核员。用户在对话里说了一句话，助理回复了一段正文。按给定的标准判断这一轮是否达标：标准里的每一项都做到才算通过，标准之外的不加要求。\
只看给出的正文，不要用你自己的知识判断里面的事实对不对。reason 用一两句话说明。"""
user = """今天是 {{ today }}。

用户说：{{ said }}

标准：{{ rubric }}

助理的正文：
{{ reply }}
"""
