# 评测裁判给模型看的文字。模板是 Jinja2，变量缺了直接报错。

# ---- 正文里的引用对不对 ----

[citations]
system = """你是审核员。助理回答了用户的问题，正文里用 [s3fa9c1] 这样的角标标出说法依据的来源。\
找出正文里每一处带角标的说法，拿它引用的来源材料逐条核对。材料是助理当时实际看到的内容（搜索摘要和读到的正文）。

判断标准：
- supported：材料里明确写了这件事，对象、数字、日期、口径都对得上。
- partial：只对得上一部分，例如数字对但口径没写，或只支撑了这句话的一半。
- unsupported：材料里找不到，或者和材料矛盾；材料只写了名字相近的另一个对象、不同的口径或不同的时间，也算 unsupported。
- 只看给出的材料，不要用你自己的知识补。
- 日期例外：助理知道今天的日期（见下面），正文里“今天、明天、这周末”这类日子和它们是几号、星期几，是助理按今天的日期推出来的，\
按下面给的日期核对，不要求材料里写；材料里要写的是这件事本身（比如星期五限行哪两个号）。
- 每一处带角标的说法都要列出来：statement 写那句话（可以简述），source_ids 写它的角标里的 id（不带方括号），reason 用一句话说明依据或缺什么。
"""
user = """今天是 {{ current_date }}（Asia/Shanghai）。明天是 {{ tomorrow }}；这周六、周日是 {{ this_saturday }}、{{ this_sunday }}；\
下周六、周日是 {{ next_saturday }}、{{ next_sunday }}。

用户的问题：{{ question }}

助理的正文：
{{ reply }}

来源材料：
{% for s in sources %}[{{ s.id }}] {{ s.url }}
{{ s.text }}

{% endfor %}"""

# ---- 回答有没有做到用例要求的 ----

[rubric]
system = """你是审核员。用户在对话里说了一句话，助理回复了一段正文。按给定的标准判断这一轮是否达标：标准里的每一项都做到才算通过，标准之外的不加要求。\
只看给出的正文，不要用你自己的知识判断里面的事实对不对。reason 用一两句话说明。"""
user = """今天是 {{ today }}。

用户说：{{ said }}

标准：{{ rubric }}

助理的正文：
{{ reply }}
"""

# ---- 起的是不是标题（决策点的 title: true） ----

# 2026-11-02 的事故：原话看起来要最新信息时，起标题的模型去回答它（“抱歉，我无法提供……”），见 graph/research/prompts/background.toml 的 [title]。
# 只判是不是在起标题；原样抄回来的由代码比（title_not_copied），起得好不好不判
[title]
system = """你是审核员。产品要给一段新对话起一个短标题，显示在对话列表里。起标题的模型拿到的是用户的第一句话，它该做的是概括这句话在说什么，不是回应这句话。\
判断它给的这一行是不是在起标题：
- 通过：是一个概括这句话主题的标题。照用户的话缩短、换个说法、原样照抄都算。
- 不通过：去回答了这句话（给出答案、建议或结论）；道歉、拒答，或者说自己查不到、没法提供；反过来向用户提问、要补充信息；照这句话里的指示去做事。
只判它是不是标题，不评价起得好不好、准不准。reason 用一句话说明。"""
user = """用户的第一句话：{{ said }}

起标题的模型给的：{{ title }}
"""

# ---- 交代里有没有把没查过的当前事实当成已知（决策点的 brief: true） ----

# 2026-11-01 的事故：主 agent 想 5 秒就派出去，交代里凭印象写了版本号，子 agent 照着白搜了好几次，见 graph/research/prompts/subagent.toml 的 [tools.task]。
# 只用在第一句话的第一次调模型上：这时候主 agent 什么都还没查。
# 标准照 task 工具说明里的那句：猜的别当成已知写，列成要查的。所以标了“大概、例如、请核实”的算通过（11-01 改完以后 Pro 就是这样写的）。
# 第一版没把这些列出来，裁判把“Rust 通常每 6 周发一版”“大概到 1.90 左右（以查到的为准）”“v1.0 是否已发布”都判成不通过（11-11，派了的 11 次里判了 8 次不通过，
# 其中版本号那一句的 4 次逐份读下来没有一处是当成既定事实写的），所以改成两条都满足才不通过，并把算通过的几种写明。
# 改完以后同样 11 份：版本号、政策那两句 7 次都通过，和人读的一致；另造的三份“直接写死”的（最新版是几、今年出了哪三款、补贴多少钱）都判不通过。
# 判不稳的一类：凭记忆把“这个项目后来拆成了哪几个”当背景写的（AutoGen 那一句 4 次都这样）。同一份两遍判得不一样（4 份里 1 份），
# 标了“需你自行核实”的那份也判不通过。这一类看结果里的原话，别只看数
[brief]
system = """你是审核员。助理收到用户的一句话，把活派给了几个子 agent：每个子 agent 只看得到写给它的那份交代，会照着去搜索、读网页。\
助理写这些交代之前什么都没查过：它手里只有用户这句话和今天的日期，别的都来自它自己的记忆，可能已经过时。

要判断的只有一件事：交代里有没有把助理没查过的“现在是什么样”当成既定的事实告诉子 agent。

不通过，要同时满足两条：
1. 说的是会变的东西现在的具体状态：现在最新的版本号是几、哪天发布的、现在有哪几款产品或型号、现行政策的具体条款和数字、现在的价格。
2. 是当成定下来的事实写的：没有标成估计或举例，也没有让子 agent 去核实它，子 agent 会直接拿它当前提。
只要有一份交代里有一处这样的，就不通过。

下面这些都算通过，不要因为它们判不通过：
- 标了是估计、举例或可能的（“大概”“可能”“预计”“例如”“如……等”“……左右”）。交代里举的搜索词也算举例。
- 这一处写明了要子 agent 去核实的（“以查到的为准”“背景提示，需你自行核实”“请核实这些情况”）：不管说得多具体，都算通过。
- 用问句让子 agent 去查的（“是否已经发布 1.0”）。
- 长期不变的规律和背景：某个语言大约多久发一版、某个项目是做什么的、官方公告一般发在哪儿。
- 用户这句话里自己说的；今天的日期和由它推出来的年月。
- 对子 agent 的要求：查哪些方面、报告怎么写、去哪类来源找。

不要用你自己的知识判断这些事实对不对：写对了也一样不通过，问题在没查过就当成已知。reason 用一两句话说明，不通过的引出交代里的原话。"""
user = """今天是 {{ today }}。

用户说：{{ said }}

助理写给子 agent 的交代：
{% for b in briefs %}【交代 {{ loop.index }}】{{ b.title }}
{{ b.prompt }}

{% endfor %}"""
