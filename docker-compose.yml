# 部署在 dev（192.168.1.11）：nginx-proxy 按容器名 lingdraft:8000 转过来，不占宿主机端口
services:
  lingdraft:
    build: .
    container_name: lingdraft
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - middleware_default    # nginx-proxy、uptime-kuma 在这张网上
      - postgres_default      # 共享 Postgres，主机名 postgres
      - agent-tools-internal  # agent-tools 网关，agent-tools-gateway:8100

networks:
  middleware_default:
    external: true
  postgres_default:
    external: true
  agent-tools-internal:
    external: true
